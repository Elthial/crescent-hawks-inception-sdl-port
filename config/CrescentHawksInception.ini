# Directory containing a legally obtained original game installation.
# Relative paths are resolved from the directory containing the executable.
# Keep '.' when the executable and this file are placed in that installation.
asset_directory=.

# Host-side PC-speaker clock profile, in emulated CPU cycles per millisecond.
# 240: IBM PC compatible; 750: 286; 1510: reference DOSBox-X capture;
# 3000: faster DOSBox-style profile. This affects CPU-loop effects, not pitch.
sound_cycles=240
