name: Windows preservation build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate preservation evidence
        shell: pwsh
        run: ./tools/Test-EvidenceLayout.ps1

      - name: Build and test asset-independent C17 source
        shell: pwsh
        run: ./Build.ps1 -Headless -Configuration Release

      - name: Assemble statically linked Windows package
        shell: pwsh
        run: ./Build.ps1 -Configuration Release -Package

      - name: Upload runtime shell and checksums
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-runtime-shell
          if-no-files-found: error
          path: |
            build-release/package/*
            build-release/*-SHA256SUMS.txt
